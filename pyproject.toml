[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat-export-codex"
version = "0.1.0"
description = "Pipeline for ingesting AI chat exports into a RAG system"
authors = [{name = "AI Assistant"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "tqdm>=4.66",
    "pydantic>=1.10",
    "markdownify>=0.12",
    "python-dateutil>=2.8",
    "rich>=13.7",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
aicec = "ai_chat_export_codex.cli:app"
